name: Check Cloudflare commerce app
on:
  push:
    branches: [main]
    paths: ['commerce/**', '.github/workflows/commerce-check.yml']
  pull_request:
    paths: ['commerce/**', '.github/workflows/commerce-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commerce-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and 26 mocked provider tests
        run: npm run check
      - name: Build static assets and preserved project dashboard
        run: npm run build
      - name: Validate Worker configuration without deploying or calling AI
        run: npx --yes wrangler@4.92.0 deploy --dry-run --outdir .wrangler-dry-run
      - name: Preserve build output
        uses: actions/upload-artifact@v4
        with:
          name: commerce-cloudflare-build
          path: |
            commerce/dist
            commerce/.wrangler-dry-run
          retention-days: 7
          include-hidden-files: true
