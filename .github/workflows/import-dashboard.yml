name: Import dashboard layout
on:
  push:
    branches: [main]
    paths: ['.import/layout.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore original HTML and CSS without layout changes
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          source = Path('.import/layout.json')
          if not source.exists():
              print('Layout already imported.')
              raise SystemExit(0)
          bundle = json.loads(source.read_text())
          parts = []
          decoded = {}
          for name in ('index.html', 'dashboard.css'):
              entry = bundle[name]
              parts.extend(entry.get('parts', []))
              payload = entry.get('gzip_base64') or ''.join(Path(p).read_text().strip() for p in entry['parts'])
              content = gzip.decompress(base64.b64decode(payload, validate=True))
              assert hashlib.sha256(content).hexdigest() == entry['sha256'], name
              decoded[name] = content
          for name, content in decoded.items():
              Path(name).write_bytes(content)
          for part in parts:
              Path(part).unlink()
          source.unlink()
          PY
      - name: Vendor the pinned Supabase SDK
        run: |
          set -euo pipefail
          mkdir -p vendor
          PACK=$(npm pack @supabase/supabase-js@2.117.2 --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")
          tar -xzf "$RUNNER_TEMP/$PACK" -C "$RUNNER_TEMP" package/dist/umd/supabase.js
          cp "$RUNNER_TEMP/package/dist/umd/supabase.js" vendor/supabase.js
          curl --fail --silent --show-error --location --retry 3 'https://raw.githubusercontent.com/supabase/supabase-js/v2.117.2/LICENSE' -o vendor/LICENSE
          sha256sum vendor/supabase.js > vendor/CHECKSUMS.sha256
          node --check dashboard.js
          node --check vendor/supabase.js
      - name: Commit readable application sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dashboard.css vendor/
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import preserved dashboard layout and pinned browser SDK'
          git push origin HEAD:main
